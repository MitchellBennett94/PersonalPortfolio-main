    <div class="container contact-page">
        <h1>Contact Me</h1>
        <section class="experience-item contact-panel">
            <p class="contact-intro">Have a project, role, or collaboration in mind? Send a message and I will get back to you as soon as possible.</p>
            <div class="contact-form">
                <form id="contactForm" action="https://formsubmit.co/ajax/mitchellbennett1967@yahoo.com" method="POST" novalidate>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="name">Name</label>
                            <p class="field-error" id="nameError" aria-live="polite"></p>
                            <input type="text" id="name" name="name" placeholder="Your full name" required>
                        </div>

                        <div class="form-group">
                            <label for="email">Email</label>
                            <p class="field-error" id="emailError" aria-live="polite"></p>
                            <input type="email" id="email" name="email" placeholder="you@example.com" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="subject">Subject</label>
                        <p class="field-error" id="subjectError" aria-live="polite"></p>
                        <input type="text" id="subject" name="subject" placeholder="How can I help?" required>
                    </div>

                    <div class="form-group">
                        <label for="message">Message</label>
                        <p class="field-error" id="messageError" aria-live="polite"></p>
                        <textarea id="message" name="message" rows="6" placeholder="Share a few details about your project or opportunity." required></textarea>
                    </div>

                    <p class="form-status" id="formStatus" aria-live="polite"></p>
                    <button class="contact-submit" type="submit">Send Message</button>
                </form>
            </div>
        </section>
    </div>
